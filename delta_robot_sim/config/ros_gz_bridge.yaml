---
# Clock synchronization
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Joint trajectory commands (FIXED MODEL NAME)
- ros_topic_name: "/model/delta_robot/joint_trajectory"
  gz_topic_name: "/model/delta_robot/joint_trajectory"
  ros_type_name: "trajectory_msgs/msg/JointTrajectory"
  gz_type_name: "gz.msgs.JointTrajectory"
  direction: ROS_TO_GZ

# Joint states (FIXED MODEL NAME)
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/empty/model/delta_robot/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Pose/TF (FIXED MODEL NAME)
- ros_topic_name: "/tf"
  gz_topic_name: "/model/delta_robot/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Static TF (FIXED MODEL NAME)
- ros_topic_name: "/tf_static"
  gz_topic_name: "/model/delta_robot/pose_static"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Trajectory progress (FIXED MODEL NAME)
- ros_topic_name: "/model/delta_robot/joint_trajectory_progress"
  gz_topic_name: "/model/delta_robot/joint_trajectory_progress"
  ros_type_name: "std_msgs/msg/Float32"
  gz_type_name: "gz.msgs.Float"
  direction: GZ_TO_ROS

# Suction Activation
- ros_topic_name: "/suction/command"  
  gz_topic_name: "/suction/enable"
  ros_type_name: "std_msgs/msg/Bool"
  gz_type_name: "gz.msgs.Boolean"
  direction: ROS_TO_GZ

# Camera
- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
